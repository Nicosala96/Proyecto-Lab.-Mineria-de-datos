services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: andeslink-api
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  gui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: andeslink-gui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8000/predecir